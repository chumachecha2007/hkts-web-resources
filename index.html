<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hkts test</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            color: #00bfff;
        }
        .status-box {
            font-size: 1.8rem;
            margin-top: 20px;
        }
        .count {
            font-weight: bold;
            color: #00ffcc;
            font-size: 3rem;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>hktrainsim test</h1>
        
        <div class="status-box">
            game online:
            <span id="player-count" class="count">updating info...</span>
        </div>
    </div>

    <script>
const FIREBASE_URL = "https://hktrainsim-default-rtdb.europe-west1.firebasedatabase.app/playerstats.json";

function fetchLivePlayers() {
    fetch(FIREBASE_URL)
        .then(response => response.json())
        .then(data => {
            if (data && data.count !== undefined) {
                document.getElementById('player-count').textContent = data.count;
            } else {
                document.getElementById('player-count').textContent = "0";
            }
        })
        .catch(error => {
            console.error("Error fetching data:", error);
            document.getElementById('player-count').textContent = "Error";
        });
}

fetchLivePlayers();
setInterval(fetchLivePlayers, 5000); // Обновление каждые 5 секунд

    </script>
</body>
</html>
